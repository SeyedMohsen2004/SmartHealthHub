services:
  migrate:
    image: smarthealthhub:development
    build:
      context: .
      target: development
    command: python manage.py migrate --noinput
    env_file:
      - .env
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy

  api:
    image: smarthealthhub:development
    build:
      context: .
      target: development
    command: python manage.py runserver 0.0.0.0:8000
    env_file:
      - .env
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    image: smarthealthhub:development
    build:
      context: .
      target: development
    command: celery -A config worker --loglevel=INFO --concurrency=2
    env_file:
      - .env
    volumes:
      - .:/app
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "celery -A config inspect ping --destination celery@$${HOSTNAME} --timeout 5 | grep -q pong",
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 15s

  beat:
    image: smarthealthhub:development
    build:
      context: .
      target: development
    command: >-
      celery -A config beat --loglevel=INFO
      --pidfile=/tmp/celerybeat.pid
      --schedule=/tmp/celerybeat-schedule
    env_file:
      - .env
    volumes:
      - .:/app
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "test -s /tmp/celerybeat.pid && kill -0 $$(cat /tmp/celerybeat.pid)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  db:
    image: postgres:16-alpine
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smarthealthhub}
      POSTGRES_USER: ${POSTGRES_USER:-smarthealthhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smarthealthhub_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8.2.8-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  redis_data:
