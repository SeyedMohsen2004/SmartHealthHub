services:
  migrate:
    image: smarthealthhub:development
    build:
      context: .
      target: development
    command: python manage.py migrate --noinput
    env_file:
      - .env
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy

  api:
    image: smarthealthhub:development
    build:
      context: .
      target: development
    command: python manage.py runserver 0.0.0.0:8000
    env_file:
      - .env
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  db:
    image: postgres:16-alpine
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smarthealthhub}
      POSTGRES_USER: ${POSTGRES_USER:-smarthealthhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smarthealthhub_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
