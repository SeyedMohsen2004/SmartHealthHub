x-app-build: &app-build
  context: .
  target: runtime
  args:
    APP_UID: ${APP_UID:-10001}
    APP_GID: ${APP_GID:-10001}

x-app-environment: &app-environment
  DJANGO_SETTINGS_MODULE: config.settings.production
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY is required}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?DJANGO_ALLOWED_HOSTS is required}
  DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-}
  DJANGO_TRUST_X_FORWARDED_PROTO: ${DJANGO_TRUST_X_FORWARDED_PROTO:?Set forwarded-protocol trust explicitly}
  DJANGO_SECURE_SSL_REDIRECT: ${DJANGO_SECURE_SSL_REDIRECT:?Set HTTPS redirect behavior explicitly}
  DJANGO_SECURE_HSTS_SECONDS: ${DJANGO_SECURE_HSTS_SECONDS:-31536000}
  DRF_NUM_PROXIES: ${DRF_NUM_PROXIES:-0}
  DRF_ANON_THROTTLE_RATE: ${DRF_ANON_THROTTLE_RATE:-100/hour}
  DRF_USER_THROTTLE_RATE: ${DRF_USER_THROTTLE_RATE:-1000/hour}
  DRF_AUTH_REGISTER_THROTTLE_RATE: ${DRF_AUTH_REGISTER_THROTTLE_RATE:-5/hour}
  DRF_AUTH_LOGIN_THROTTLE_RATE: ${DRF_AUTH_LOGIN_THROTTLE_RATE:-10/min}
  DRF_AUTH_REFRESH_THROTTLE_RATE: ${DRF_AUTH_REFRESH_THROTTLE_RATE:-30/min}
  DRF_AUTH_LOGOUT_THROTTLE_RATE: ${DRF_AUTH_LOGOUT_THROTTLE_RATE:-30/min}
  POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
  POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
  POSTGRES_HOST: db
  POSTGRES_PORT: "5432"
  POSTGRES_CONN_MAX_AGE: ${POSTGRES_CONN_MAX_AGE:-60}
  CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
  APPOINTMENT_REMINDER_LEAD_HOURS: ${APPOINTMENT_REMINDER_LEAD_HOURS:-24}
  APPOINTMENT_REMINDER_SCAN_INTERVAL_SECONDS: ${APPOINTMENT_REMINDER_SCAN_INTERVAL_SECONDS:-60}
  APPOINTMENT_REMINDER_BATCH_SIZE: ${APPOINTMENT_REMINDER_BATCH_SIZE:-500}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  GUNICORN_BIND: 0.0.0.0:8000
  GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
  GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-30}
  GUNICORN_GRACEFUL_TIMEOUT: ${GUNICORN_GRACEFUL_TIMEOUT:-30}

services:
  db:
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:8.2.8-alpine@sha256:a7859ed111db3c1f5404a973a4747505d559fb5ca32d37e447afc0ef845a2103
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  release:
    image: smarthealthhub:${IMAGE_TAG:-production}
    build: *app-build
    command:
      - sh
      - -c
      - python manage.py migrate --noinput && python manage.py collectstatic --noinput
    environment: *app-environment
    volumes:
      - static_data:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  web:
    image: smarthealthhub:${IMAGE_TAG:-production}
    environment: *app-environment
    volumes:
      - static_data:/app/staticfiles:ro
      - media_data:/app/media
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    depends_on:
      release:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: 35s

  worker:
    image: smarthealthhub:${IMAGE_TAG:-production}
    environment: *app-environment
    command: celery -A config worker --loglevel=INFO --concurrency=2
    depends_on:
      release:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "celery -A config inspect ping --destination celery@$${HOSTNAME} --timeout 5 | grep -q pong",
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    stop_grace_period: 30s

  beat:
    image: smarthealthhub:${IMAGE_TAG:-production}
    environment: *app-environment
    command: >-
      celery -A config beat --loglevel=INFO
      --pidfile=/tmp/celerybeat.pid
      --schedule=/tmp/celerybeat-schedule
    depends_on:
      release:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "test -s /tmp/celerybeat.pid && kill -0 $$(cat /tmp/celerybeat.pid)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 30s

volumes:
  postgres_data:
  redis_data:
  static_data:
  media_data:
