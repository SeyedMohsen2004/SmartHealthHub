name: CI

permissions:
  contents: read

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_DB: smarthealthhub
          POSTGRES_USER: smarthealthhub
          POSTGRES_PASSWORD: smarthealthhub_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smarthealthhub -d smarthealthhub"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DJANGO_SECRET_KEY: ci-only-synthetic-secret-key-with-more-than-fifty-characters
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DJANGO_CSRF_TRUSTED_ORIGINS: https://localhost
      DJANGO_TRUST_X_FORWARDED_PROTO: "False"
      POSTGRES_DB: smarthealthhub
      POSTGRES_USER: smarthealthhub
      POSTGRES_PASSWORD: smarthealthhub_password
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install --require-hashes --requirement requirements-dev.txt

      - name: Validate dependency consistency
        run: python -m pip check

      - name: Validate dependency lock freshness
        env:
          CUSTOM_COMPILE_COMMAND: >-
            python -m piptools compile --generate-hashes --allow-unsafe
            --strip-extras --output-file=requirements.txt requirements.in
        run: |
          python -m piptools compile \
            --generate-hashes \
            --allow-unsafe \
            --strip-extras \
            --resolver=backtracking \
            --output-file=requirements.txt \
            requirements.in
          CUSTOM_COMPILE_COMMAND="python -m piptools compile --generate-hashes --allow-unsafe --strip-extras --output-file=requirements-dev.txt requirements-dev.in" \
            python -m piptools compile \
              --generate-hashes \
              --allow-unsafe \
              --strip-extras \
              --resolver=backtracking \
              --output-file=requirements-dev.txt \
              requirements-dev.in
          git diff --exit-code -- requirements.txt requirements-dev.txt

      - name: Audit runtime dependencies and generate SBOM
        run: >-
          python -m pip_audit
          --requirement requirements.txt
          --disable-pip
          --format cyclonedx-json
          --output runtime-sbom.cdx.json

      - name: Upload runtime dependency SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-python-sbom
          path: runtime-sbom.cdx.json
          if-no-files-found: error
          retention-days: 14

      - name: Audit development dependencies
        run: >-
          python -m pip_audit
          --requirement requirements-dev.txt
          --disable-pip

      - name: Validate Docker Compose configuration
        run: |
          cp .env.example .env
          docker compose config --quiet

      - name: Check formatting
        run: black --check .

      - name: Lint
        run: flake8 .

      - name: Run Django checks
        run: |
          python manage.py check
          python manage.py check --deploy --settings=config.settings.production

      - name: Check migration drift
        run: python manage.py makemigrations --check --dry-run

      - name: Validate OpenAPI schema
        run: >-
          python manage.py spectacular
          --file /tmp/schema.yml
          --validate
          --fail-on-warn

      - name: Run tests with branch coverage
        run: >-
          pytest
          --cov=accounts
          --cov=appointments
          --cov=config
          --cov=notifications
          --cov=providers
          --cov-branch
          --cov-report=term-missing
          --cov-fail-under=90

  production-runtime:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      COMPOSE_PROJECT_NAME: smarthealthhub-ci
      IMAGE_TAG: ci
      APP_PORT: "18000"
      DJANGO_SECRET_KEY: ci-only-synthetic-secret-key-with-more-than-fifty-characters
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DJANGO_CSRF_TRUSTED_ORIGINS: https://localhost
      DJANGO_TRUST_X_FORWARDED_PROTO: "True"
      DJANGO_SECURE_SSL_REDIRECT: "True"
      POSTGRES_DB: smarthealthhub_runtime
      POSTGRES_USER: smarthealthhub_runtime
      POSTGRES_PASSWORD: synthetic-runtime-password
      TRIVY_VERSION: 0.73.0
      TRIVY_ARCHIVE_SHA256: 2edd39da482bb4e9831962487b68f68e3928ec3137794757f54d00383d79547b
      POSTGRES_IMAGE: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
      REDIS_IMAGE: redis:8.2.8-alpine@sha256:a7859ed111db3c1f5404a973a4747505d559fb5ca32d37e447afc0ef845a2103

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate production Compose configuration
        run: docker compose -f docker-compose.prod.yml config --quiet

      - name: Build production image
        run: docker compose -f docker-compose.prod.yml build release

      - name: Install checksum-verified Trivy
        run: |
          archive="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          release_url="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}"
          curl --fail --location --silent --show-error \
            --output "/tmp/${archive}" "${release_url}/${archive}"
          curl --fail --location --silent --show-error \
            --output /tmp/trivy-checksums.txt \
            "${release_url}/trivy_${TRIVY_VERSION}_checksums.txt"
          echo "${TRIVY_ARCHIVE_SHA256}  /tmp/${archive}" | sha256sum --check --strict
          expected_checksum="$(grep " ${archive}$" /tmp/trivy-checksums.txt | cut -d ' ' -f 1)"
          test -n "$expected_checksum"
          test "$expected_checksum" = "$TRIVY_ARCHIVE_SHA256"
          tar --extract --gzip --file "/tmp/${archive}" --directory /tmp trivy
          sudo install --mode 0755 /tmp/trivy /usr/local/bin/trivy
          trivy --version

      - name: Scan production container images
        run: |
          docker pull "$POSTGRES_IMAGE"
          docker pull "$REDIS_IMAGE"
          for image in \
            "smarthealthhub:${IMAGE_TAG}" \
            "$POSTGRES_IMAGE" \
            "$REDIS_IMAGE"; do
            trivy image \
              --db-repository ghcr.io/aquasecurity/trivy-db:2 \
              --scanners vuln \
              --pkg-types os \
              --severity HIGH,CRITICAL \
              --ignore-unfixed \
              --exit-code 1 \
              "$image"
          done

      - name: Start and verify production stack
        run: |
          compose=(docker compose -f docker-compose.prod.yml)
          "${compose[@]}" up --detach --wait --wait-timeout 120

          release_id="$("${compose[@]}" ps --all --quiet release)"
          test -n "$release_id"
          test "$(docker inspect --format '{{.State.ExitCode}}' "$release_id")" = "0"

          test "$("${compose[@]}" run --rm --no-deps --entrypoint id web -u)" = "10001"
          test "$("${compose[@]}" exec -T worker id -u)" = "10001"
          test "$("${compose[@]}" exec -T beat id -u)" = "10001"
          "${compose[@]}" run --rm --no-deps --entrypoint sh web -c \
            "! command -v gcc && ! command -v make && ! command -v pip && ! command -v pip-compile && ! command -v pip-audit && ! command -v pytest && ! command -v black && ! command -v flake8"
          "${compose[@]}" exec -T web python -c \
            "assert b'gunicorn' in open('/proc/1/cmdline', 'rb').read()"
          "${compose[@]}" exec -T worker python -c \
            "assert b'celery' in open('/proc/1/cmdline', 'rb').read()"
          "${compose[@]}" exec -T beat python -c \
            "assert b'celery' in open('/proc/1/cmdline', 'rb').read()"
          "${compose[@]}" exec -T redis redis-cli ping | grep --fixed-strings PONG
          test "$("${compose[@]}" ps --all --status running --quiet beat | wc -l)" = "1"
          "${compose[@]}" exec -T web python manage.py migrate --check
          "${compose[@]}" exec -T web python -c \
            "import os; from pathlib import Path; assert not os.access('/app/manage.py', os.W_OK); assert Path('/app/staticfiles/admin/css/base.css').is_file(); p = Path('/app/media/.ci-write-test'); p.write_text('ok'); p.unlink()"
          curl --fail --silent --show-error \
            --header "X-Forwarded-Proto: https" \
            http://127.0.0.1:18000/api/v1/health/

          "${compose[@]}" exec -T web python manage.py shell -c \
            "from datetime import timedelta; from django.contrib.auth import get_user_model; from django.utils import timezone; from appointments.models import Appointment; from providers.models import Provider; User = get_user_model(); patient = User.objects.create_user(username='reminder-patient', email='reminder-patient@example.com', password='SyntheticPass123!', role=User.Roles.PATIENT); doctor = User.objects.create_user(username='reminder-doctor', email='reminder-doctor@example.com', password='SyntheticPass123!', role=User.Roles.DOCTOR, first_name='Synthetic', last_name='Doctor'); provider = Provider.objects.create(user=doctor, specialization='Test', medical_license_number='CI-REMINDER', experience_years=1, consultation_fee='1.00', is_verified=True); scheduled = timezone.localtime(timezone.now() + timedelta(hours=1)); Appointment.objects.create(patient=patient, provider=provider, appointment_date=scheduled.date(), appointment_time=scheduled.time().replace(tzinfo=None))"
          "${compose[@]}" exec -T web python manage.py shell -c \
            "from notifications.tasks import dispatch_due_appointment_reminders; dispatch_due_appointment_reminders.delay()"
          for attempt in {1..30}; do
            if "${compose[@]}" exec -T web python manage.py shell -c \
              "import sys; from notifications.models import Notification; sys.exit(0 if Notification.objects.filter(kind=Notification.Kind.APPOINTMENT_REMINDER).count() == 1 else 1)"; then
              break
            fi
            if [ "$attempt" = "30" ]; then
              echo "Celery worker did not create the synthetic reminder."
              exit 1
            fi
            sleep 1
          done
          "${compose[@]}" exec -T web python manage.py shell -c \
            "from notifications.tasks import dispatch_due_appointment_reminders; dispatch_due_appointment_reminders.delay()"
          sleep 2
          "${compose[@]}" exec -T web python manage.py shell -c \
            "from notifications.models import Notification; assert Notification.objects.filter(kind=Notification.Kind.APPOINTMENT_REMINDER).count() == 1"

          if docker history --no-trunc "smarthealthhub:${IMAGE_TAG}" \
            | grep --fixed-strings --quiet "$DJANGO_SECRET_KEY"; then
            echo "Synthetic runtime secret was found in image history."
            exit 1
          fi

          release_id_before="$release_id"
          "${compose[@]}" restart web
          for attempt in {1..30}; do
            if curl --fail --silent \
              --header "X-Forwarded-Proto: https" \
              http://127.0.0.1:18000/api/v1/health/ >/dev/null; then
              break
            fi
            if [ "$attempt" = "30" ]; then
              echo "Web did not become ready after restart."
              exit 1
            fi
            sleep 1
          done
          test "$("${compose[@]}" ps --all --quiet release)" = "$release_id_before"

      - name: Show production service logs
        if: always()
        run: docker compose -f docker-compose.prod.yml logs --no-color

      - name: Remove production smoke stack
        if: always()
        run: docker compose -f docker-compose.prod.yml down --volumes --remove-orphans
