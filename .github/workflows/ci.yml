name: CI

permissions:
  contents: read

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: smarthealthhub
          POSTGRES_USER: smarthealthhub
          POSTGRES_PASSWORD: smarthealthhub_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smarthealthhub -d smarthealthhub"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DJANGO_SECRET_KEY: ci-only-synthetic-secret-key-with-more-than-fifty-characters
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DJANGO_CSRF_TRUSTED_ORIGINS: https://localhost
      DJANGO_TRUST_X_FORWARDED_PROTO: "False"
      POSTGRES_DB: smarthealthhub
      POSTGRES_USER: smarthealthhub
      POSTGRES_PASSWORD: smarthealthhub_password
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate dependency consistency
        run: pip check

      - name: Validate Docker Compose configuration
        run: |
          cp .env.example .env
          docker compose config --quiet

      - name: Check formatting
        run: black --check .

      - name: Lint
        run: flake8 .

      - name: Run Django checks
        run: |
          python manage.py check
          python manage.py check --deploy --settings=config.settings.production

      - name: Check migration drift
        run: python manage.py makemigrations --check --dry-run

      - name: Validate OpenAPI schema
        run: >-
          python manage.py spectacular
          --file /tmp/schema.yml
          --validate
          --fail-on-warn

      - name: Run tests with branch coverage
        run: >-
          pytest
          --cov=accounts
          --cov=appointments
          --cov=config
          --cov=notifications
          --cov=providers
          --cov-branch
          --cov-report=term-missing
          --cov-fail-under=90
